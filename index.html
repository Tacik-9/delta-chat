<script>
  const chat = document.getElementById('chat');

  function appendMessage(text, translated, from, name = '') {
    const div = document.createElement('div');
    div.className = 'msg ' + from;
    div.innerHTML = `<strong>${name || (from === 'you' ? 'Вы' : 'Собеседник')}</strong>: ${text}`;
    if (translated) {
      const trans = document.createElement('div');
      trans.className = 'translated';
      trans.textContent = `(${translated})`;
      div.appendChild(trans);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function translate(text, sourceLang, targetLang) {
    try {
      const res = await fetch('https://libretranslate.de/translate', {
        method: 'POST',
        body: JSON.stringify({
          q: text,
          source: sourceLang,
          target: targetLang,
          format: 'text'
        }),
        headers: { 'Content-Type': 'application/json' }
      });

      if (!res.ok) throw new Error('Ошибка перевода');

      const data = await res.json();
      return data.translatedText;
    } catch (err) {
      console.error('Ошибка при переводе:', err);
      return '[Ошибка перевода]';
    }
  }

  async function sendMessage() {
    const input = document.getElementById('message');
    const userLang = document.getElementById('userLang').value;
    const peerLang = document.getElementById('peerLang').value;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    appendMessage(text, null, 'you');

    const translated = await translate(text, userLang, peerLang);
    appendMessage(translated, text, 'other');
  }
</script>
